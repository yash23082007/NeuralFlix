services:
  - type: web
    name: movie-recs-backend
    env: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-recs-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: WATCHMODE_API_KEY
        sync: false
      - key: TRAKT_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: COOKIE_DOMAIN
        sync: false
      - key: LITE_MODE
        value: "true"
      - key: ENABLE_EXPERIMENTAL_ML
        value: "true"
      - key: ENABLE_NCF
        value: "true"
      - key: ENABLE_SASREC
        value: "true"
      - key: ENABLE_GNN
        value: "true"
      - key: ENABLE_BANDIT
        value: "true"
      - key: ENABLE_VECTOR_SEARCH
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NEURALFLIX_DEMO_MODE
        value: "false"

databases:
  - name: movie-recs-db
    databaseName: movie_recs
    user: movie_user
