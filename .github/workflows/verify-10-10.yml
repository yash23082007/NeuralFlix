name: 10/10 Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Verify Architecture Constraints (Phase 10)
      run: |
        cd backend
        python scripts/verify_e2e.py

    - name: Run Evaluation Metrics Tests
      run: |
        cd backend/evaluation
        python -m unittest test_metrics.py
