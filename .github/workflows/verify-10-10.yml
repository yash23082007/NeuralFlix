name: 10/10 Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-serving.txt
        pip install pytest pytest-asyncio

    - name: Verify Architecture Constraints (Phase 10)
      run: |
        cd backend
        python scripts/verify_e2e.py

    - name: Run Python Security & Recommendation Tests
      run: |
        cd backend
        pytest tests/

    - name: Run Evaluation Metrics Tests
      run: |
        cd backend/evaluation
        python -m unittest test_metrics.py

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: "22"
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend-next
        npm ci
        
    - name: Run Frontend Lint
      run: |
        cd frontend-next
        npm run lint
        
    - name: Run Clean Frontend Build
      run: |
        cd frontend-next
        npm run build
