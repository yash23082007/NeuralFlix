name: 10/10 Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run v4 tests
      run: |
        cd backend
        pytest app/tests/ -v

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: "22"
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend-next
        npm ci
        
    - name: Run Frontend Lint
      run: |
        cd frontend-next
        npm run lint
        
    - name: Run Clean Frontend Build
      run: |
        cd frontend-next
        npm run build
